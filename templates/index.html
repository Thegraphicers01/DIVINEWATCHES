<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Divine Watches | Premium Horology Labs</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brandBlue: '#061221',
            glassBlue: '#DDE8ED',
          }
        }
      }
    }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap');
    body { font-family: 'Inter', sans-serif; background-color: #020813; color: #ffffff; }
    .font-serif-premium { font-family: 'Playfair Display', serif; }
    .bg-radial-stealth { background: radial-gradient(circle at center, #0a192f 0%, #020813 100%); }
    .bg-radial-alpinist { background: radial-gradient(circle at center, #1b2d3c 0%, #091118 100%); }
    .bg-radial-heritage { background: radial-gradient(circle at center, #111625 0%, #05070b 100%); }
  </style>
</head>
<body class="overflow-x-hidden">

  <div id="root"></div>

  <script type="text/babel">
    const HeaderState = () => {
      // 1. Core Reactive Architecture Engine States
      const [viewState, setViewState] = React.useState('intro'); // 'intro', 'home', 'stealth', 'alpinist', 'heritage'
      const [cartOpen, setCartOpen] = React.useState(false);
      const [cartItem, setCartItem] = React.useState(null);

      const panels = [
        { className: "top-0 left-[-166px] w-[699px] h-[900px] absolute bg-[#061221]", "aria-hidden": true },
        { className: "-top-px left-[803px] w-[741px] h-[927px] absolute bg-[#061221]", "aria-hidden": true },
      ];

      const addToCart = (name, price) => {
        setCartItem({ name, price });
        setCartOpen(true);
      };

      const scrollToContact = (e) => {
        e.preventDefault();
        document.getElementById('contact-target-section')?.scrollIntoView({ behavior: 'smooth' });
      };

      return (
        <div className="min-h-screen relative">
          
          {/* PREMIUM FLOATING HEAD NAVBAR */}
          <nav class="fixed top-0 left-0 w-full z-40 bg-[#020813]/80 backdrop-blur-md border-b border-white/5 px-8 py-4 flex justify-between items-center">
            <div class="text-xl font-bold tracking-[4px] cursor-pointer" onClick={() => setViewState('home')}>
              DIVINE WATCHES
            </div>
            <div class="flex gap-8 text-xs tracking-widest text-white/60">
              <button onClick={() => setViewState('home')} class="hover:text-white transition-colors uppercase">Collections</button>
              <button onClick={scrollToContact} class="hover:text-white transition-colors uppercase">Contact Us</button>
            </div>
            <button onClick={() => setCartOpen(true)} class="relative p-2 hover:text-white/80 transition-colors text-xs tracking-widest uppercase">
              BAG ({cartItem ? 1 : 0})
            </button>
          </nav>

          {/* ==================== SCREEN STATE 1: INTRO SYSTEM OVERVIEW ==================== */}
          {viewState === 'intro' && (
            <main className="bg-white overflow-hidden w-full min-w-[1440px] min-h-[900px] relative mx-auto animate-fade-in">
              <section aria-label="Divine Watches header background" className="relative w-full min-w-[1440px] min-h-[900px]">
                {panels.map((panel, index) => (
                  <div key={index} aria-hidden={panel["aria-hidden"]} className={panel.className} />
                ))}
                <h1 onClick={() => setViewState('home')} className="absolute top-[calc(50.00%_-_76px)] left-[calc(50.00%_-_345px)] h-[86px] flex items-center justify-center opacity-10 [font-family:'Cinzel-Bold',Helvetica] font-bold text-variable-collection-glass-blue text-[64px] text-center tracking-[0] leading-[normal] whitespace-nowrap cursor-pointer hover:opacity-20 transition-opacity">
                  DIVINE WATCHES
                </h1>
                <div class="absolute bottom-16 left-1/2 transform -translate-x-1/2 z-20">
                  <button onClick={() => setViewState('home')} class="px-8 py-3 bg-white text-[#061221] font-bold text-xs tracking-[4px] uppercase transition-all duration-300 hover:bg-transparent hover:text-white border border-white">
                    VIEW ARCHIVE SECTIONS →
                  </button>
                </div>
              </section>
            </main>
          )}

          {/* ==================== SCREEN STATE 2: CORE COLLECTION GRID INTERFACE ==================== */}
          {viewState === 'home' && (
            <div class="pt-24 animate-fade-in">
              <div class="relative w-full h-[35vh] flex items-center justify-center bg-brandBlue overflow-hidden border-b border-white/5">
                <h1 class="opacity-10 font-bold text-glassBlue text-5xl md:text-8xl tracking-[12px] select-none text-center font-serif-premium">
                  DIVINE WATCHES
                </h1>
              </div>

              <section class="max-w-[1440px] mx-auto px-8 py-20">
                <div class="mb-12">
                  <span class="text-xs tracking-[4px] text-white/40 block mb-2">CURATED RELEASES</span>
                  <h2 class="text-3xl font-light tracking-[2px] font-serif-premium">THE 2026 CHRONO LINEUP</h2>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
                  {/* Card 1: Stealth */}
                  <div onClick={() => setViewState('stealth')} class="bg-white/[0.02] border border-white/10 rounded-2xl p-8 text-center transition-all duration-300 hover:-translate-y-2 hover:bg-white/[0.05] hover:border-white/20 cursor-pointer group">
                    <div class="w-full h-64 bg-black/20 rounded-xl mb-6 flex items-center justify-center border border-white/5">
                      <span class="text-white/20 group-hover:scale-105 transition-transform duration-300 text-xs tracking-widest">[ CASIO STEALTH IMAGE ]</span>
                    </div>
                    <span class="text-[10px] tracking-[2px] text-white/40 block mb-1 uppercase">PROSPEX TACTICAL // TYPE 01</span>
                    <h3 class="text-lg font-semibold tracking-wide mb-2">CHRONO TACTICAL</h3>
                    <p class="text-xs text-white/50 mb-4 line-clamp-1">STEALTH SERIES. ELITE BLACKOUT.</p>
                    <span class="text-sm font-bold tracking-wider">$249</span>
                  </div>

                  {/* Card 2: Alpinist */}
                  <div onClick={() => setViewState('alpinist')} class="bg-white/[0.02] border border-white/10 rounded-2xl p-8 text-center transition-all duration-300 hover:-translate-y-2 hover:bg-white/[0.05] hover:border-white/20 cursor-pointer group">
                    <div class="w-full h-64 bg-black/20 rounded-xl mb-6 flex items-center justify-center border border-white/5">
                      <span class="text-white/20 group-hover:scale-105 transition-transform duration-300 text-xs tracking-widest">[ ALPINIST CHRONO IMAGE ]</span>
                    </div>
                    <span class="text-[10px] tracking-[2px] text-white/40 block mb-1 uppercase">PROSPEX EXPLORATION // TYPE 02</span>
                    <h3 class="text-lg font-semibold tracking-wide mb-2">ALPINIST CHRONO</h3>
                    <p class="text-xs text-white/50 mb-4 line-clamp-1">CONQUER THE SUMMIT. MASTER THE COLD.</p>
                    <span class="text-sm font-bold tracking-wider">$299</span>
                  </div>

                  {/* Card 3: Royal Heritage */}
                  <div onClick={() => setViewState('heritage')} class="bg-white/[0.02] border border-white/10 rounded-2xl p-8 text-center transition-all duration-300 hover:-translate-y-2 hover:bg-white/[0.05] hover:border-white/20 cursor-pointer group">
                    <div class="w-full h-64 bg-black/20 rounded-xl mb-6 flex items-center justify-center border border-white/5">
                      <span class="text-white/20 group-hover:scale-105 transition-transform duration-300 text-xs tracking-widest">[ ROYAL HERITAGE IMAGE ]</span>
                    </div>
                    <span class="text-[10px] tracking-[2px] text-white/40 block mb-1 uppercase">MUSEUM LEGACY // TYPE 03</span>
                    <h3 class="text-lg font-semibold tracking-wide mb-2">ROYAL HERITAGE</h3>
                    <p class="text-xs text-white/50 mb-4 line-clamp-1">TIMELESS MAJESTY. CARVED IN TRADITION.</p>
                    <span class="text-sm font-bold tracking-wider">$349</span>
                  </div>
                </div>
              </section>
            </div>
          )}

          {/* ==================== SCREEN STATE 3: PRODUCT PAGE - STEALTH ==================== */}
          {viewState === 'stealth' && (
            <div class="min-h-screen flex items-center pt-24 px-8 md:px-[8%] bg-radial-stealth animate-fade-in relative">
              <button onClick={() => setViewState('home')} class="absolute top-28 left-8 md:left-[8%] text-xs tracking-[2px] text-white/50 hover:text-white transition-colors">← BACK TO COLLECTION</button>
              <div class="w-full max-w-[1440px] mx-auto grid grid-cols-1 md:grid-cols-2 gap-12 items-center py-12">
                <div class="flex justify-center w-full max-w-md aspect-square bg-black/20 rounded-3xl border border-white/5 items-center justify-self-center"><span class="text-white/30 text-xs tracking-widest">[ STEALTH PRO ASSET ]</span></div>
                <div>
                  <span class="text-[10px] tracking-[4px] text-white/50 block mb-2 uppercase">PROSPEX TACTICAL // TYPE 01</span>
                  <h2 class="text-4xl font-bold tracking-wide mb-3 font-serif-premium">CHRONO TACTICAL</h2>
                  <div class="text-xl font-semibold tracking-wider mb-6">$249</div>
                  <p class="text-xs leading-relaxed text-white/60 mb-8">Engineered for complete stealth operations. A dark matte silhouette meets rugged reliability, ensuring ultra-high readability in tactical situations.</p>
                  <button onClick={() => addToCart('CHRONO TACTICAL', '$249')} class="px-8 py-3 rounded-full text-xs font-semibold tracking-[2px] uppercase bg-white text-black transition-all duration-300 hover:bg-white/90 active:scale-95">ADD TO CART</button>
                </div>
              </div>
            </div>
          )}

          {/* ==================== SCREEN STATE 4: PRODUCT PAGE - ALPINIST ==================== */}
          {viewState === 'alpinist' && (
            <div class="min-h-screen flex items-center pt-24 px-8 md:px-[8%] bg-radial-alpinist animate-fade-in relative">
              <button onClick={() => setViewState('home')} class="absolute top-28 left-8 md:left-[8%] text-xs tracking-[2px] text-white/50 hover:text-white transition-colors">← BACK TO COLLECTION</button>
              <div class="w-full max-w-[1440px] mx-auto grid grid-cols-1 md:grid-cols-2 gap-12 items-center py-12">
                <div class="flex justify-center w-full max-w-md aspect-square bg-black/20 rounded-3xl border border-white/5 items-center justify-self-center"><span class="text-white/30 text-xs tracking-widest">[ ALPINIST PRO ASSET ]</span></div>
                <div>
                  <span class="text-[10px] tracking-[4px] text-white/50 block mb-2 uppercase">PROSPEX EXPLORATION // TYPE 02</span>
                  <h2 class="text-4xl font-bold tracking-wide mb-3 font-serif-premium">ALPINIST CHRONO</h2>
                  <div class="text-xl font-semibold tracking-wider mb-6">$299</div>
                  <p class="text-xs leading-relaxed text-white/60 mb-8">Built to endure alpine mountain climates. Features premium casing architectural layers with functional sub-registers and emergency compass tracks.</p>
                  <button onClick={() => addToCart('ALPINIST CHRONO', '$299')} class="px-8 py-3 rounded-full text-xs font-semibold tracking-[2px] uppercase bg-white text-black transition-all duration-300 hover:bg-white/90 active:scale-95">ADD TO CART</button>
                </div>
              </div>
            </div>
          )}

          {/* ==================== SCREEN STATE 5: PRODUCT PAGE - HERITAGE ==================== */}
          {viewState === 'heritage' && (
            <div class="min-h-screen flex items-center pt-24 px-8 md:px-[8%] bg-radial-heritage animate-fade-in relative">
              <button onClick={() => setViewState('home')} class="absolute top-28 left-8 md:left-[8%] text-xs tracking-[2px] text-white/50 hover:text-white transition-colors">← BACK TO COLLECTION</button>
              <div class="w-full max-w-[1440px] mx-auto grid grid-cols-1 md:grid-cols-2 gap-12 items-center py-12">
                <div class="flex justify-center w-full max-w-md aspect-square bg-black/20 rounded-3xl border border-white/5 items-center justify-self-center"><span class="text-white/30 text-xs tracking-widest">[ HERITAGE PRO ASSET ]</span></div>
                <div>
                  <span class="text-[10px] tracking-[4px] text-white/50 block mb-2 uppercase">MUSEUM LEGACY // TYPE 03</span>
                  <h2 class="text-4xl font-bold tracking-wide mb-3 font-serif-premium">ROYAL HERITAGE</h2>
                  <div class="text-xl font-semibold tracking-wider mb-6">$349</div>
                  <p class="text-xs leading-relaxed text-white/60 mb-8">A breathtaking luxury tribute to standard traditional horology. Features micro-layered exhibition backings and velvet epsom straps.</p>
                  <button onClick={() => addToCart('ROYAL HERITAGE', '$349')} class="px-8 py-3 rounded-full text-xs font-semibold tracking-[2px] uppercase bg-white text-black transition-all duration-300 hover:bg-white/90 active:scale-95">ADD TO CART</button>
                </div>
              </div>
            </div>
          )}

          {/* ==================== CORE SYSTEM INTERACTIVE SECTIONS (CONTACT) ==================== */}
          <section id="contact-target-section" className="w-full bg-[#061221] border-t border-white/10 py-24 px-8 relative z-10">
            <div className="max-w-xl mx-auto text-center">
              <h2 className="text-3xl font-light tracking-[3px] uppercase mb-4 text-white [font-family:'Cinzel-Bold',Helvetica]">
                CONNECT WITH THE LAB
              </h2>
              <p className="text-sm text-white/60 tracking-wide mb-8 leading-relaxed">
                Subscribe for exclusive priority access to upcoming, high-end limited edition drops and tactical horology engineering insights.
              </p>
              <form onSubmit={(e) => { e.preventDefault(); alert('Transmission Received.'); }} className="flex flex-col sm:flex-row gap-3 items-center justify-center">
                <input type="email" required placeholder="ENTER YOUR EMAIL ADDRESS..." className="w-full sm:max-w-xs px-5 py-3 rounded-none border border-white/20 bg-transparent text-xs tracking-wider text-white placeholder-white/30 focus:border-white/60 transition-colors uppercase outline-none" />
                <button type="submit" className="w-full sm:w-auto px-8 py-3 rounded-none bg-white text-[#061221] font-bold text-xs tracking-widest uppercase transition-all duration-300 hover:bg-transparent hover:text-white border border-white active:scale-95 whitespace-nowrap">
                  SUBMIT →
                </button>
              </form>
            </div>
          </section>

          {/* ==================== ORIGINAL CORE EDITORIAL FOOTER ==================== */}
          <footer className="w-full bg-[#020813] border-t border-white/5 py-12 px-8 relative z-10">
            <div className="max-w-[1440px] mx-auto flex flex-col md:flex-row justify-between items-center gap-6">
              <div>
                <div className="text-xs tracking-[6px] font-bold text-white/80 mb-2 uppercase [font-family:'Cinzel-Bold',Helvetica]">
                  DIVINE WATCHES // LABS
                </div>
                <p className="text-[10px] text-white/40 tracking-wider uppercase">
                  © 2026 Chrono Labs. All structural properties reserved.
                </p>
              </div>
              <div className="flex flex-wrap gap-8 text-[10px] tracking-[2px] text-white/40 uppercase">
                <a href="#contact" onClick={scrollToContact} className="hover:text-white transition-colors">CONTACT US</a>
                <a href="#privacy" className="hover:text-white transition-colors">PRIVACY REGISTRY</a>
                <a href="#terms" className="hover:text-white transition-colors">TERMS OF OPERATION</a>
              </div>
            </div>
          </footer>

          {/* ==================== INTERACTIVE GLASSMORPHIC SLIDING CART SYSTEM ==================== */}
          <div className={`fixed inset-0 z-50 transition-all duration-300 ${cartOpen ? 'visible' : 'invisible'}`}>
            <div className={`absolute inset-0 bg-black/60 backdrop-blur-sm transition-opacity duration-300 ${cartOpen ? 'opacity-100' : 'opacity-0'}`} onClick={() => setCartOpen(false)}></div>
            <div className={`absolute top-0 right-0 w-full max-w-[420px] h-full bg-[#0a0a0c]/90 backdrop-blur-[25px] border-l border-white/10 p-10 flex flex-col transition-transform duration-300 ${cartOpen ? 'translate-x-0' : 'translate-x-full'}`}>
              <div className="flex justify-between items-center mb-10">
                <span class="text-[10px] tracking-[2px] text-white/50 uppercase">YOUR BAG // ITEMS</span>
                <button onClick={() => setCartOpen(false)} class="text-white/40 hover:text-white text-lg">✕</button>
              </div>
              
              {!cartItem ? (
                <div class="text-white/30 text-xs tracking-wider text-center py-12">Your shopping bag is completely empty.</div>
              ) : (
                <div class="flex items-center gap-4 bg-white/[0.02] p-4 rounded-xl border border-white/5 text-left animate-fade-in">
                  <div class="w-16 h-16 bg-[#15191e] rounded flex items-center justify-center text-[9px] text-white/30 text-center border border-white/5">WATCH ASSET</div>
                  <div class="flex-1">
                    <h4 class="text-xs font-semibold text-white tracking-wide">{cartItem.name}</h4>
                    <p class="text-[10px] text-white/40 mt-1">QTY: 1</p>
                  </div>
                  <div class="text-xs font-bold tracking-wider">{cartItem.price}</div>
                </div>
              )}

              <div class="mt-auto border-t border-white/10 pt-6">
                <div class="flex justify-between items-center mb-6">
                  <span class="text-[11px] tracking-wider text-white/50">SUBTOTAL</span>
                  <span class="text-lg font-bold tracking-widest">{cartItem ? cartItem.price : '$0'}</span>
                </div>
                <button onClick={() => alert('Proceeding to checkout...')} class="w-full py-4 rounded-full bg-white text-black font-semibold text-xs tracking-[2px] uppercase hover:bg-white/90 transition-transform active:scale-95">PROCEED TO CHECKOUT</button>
              </div>
            </div>
          </div>

        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<HeaderState />);
  </script>
</body>
</html>
