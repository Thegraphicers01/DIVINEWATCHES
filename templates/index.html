<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Al-Zari Couture</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <nav class="navbar">
        <div class="logo">AL-ZARI</div>
        <div class="nav-links">
            <a href="#">BURQAS</a>
            <a href="#">ABAYAS</a>
            <a href="#">COLLECTIONS</a>
        </div>
    </nav>

    <main class="collection-grid">
        {% for product in products %}
        <div class="product-card">
            <div class="image-frame">
                <img src="{{ product.image }}" alt="{{ product.title }}" class="product-img">
            </div>

            <div class="product-info">
                <span class="collection-tag">{{ product.tag }}</span>
                <h2 class="product-title">{{ product.title }}</h2>
                <p class="price">{{ product.price }}</p>

                <button class="premium-btn magnetic-btn" onclick="alert('Added {{ product.title }} to Bag!')">
                    <span class="btn-text">ADD TO BAG</span>
                    <div class="btn-fill"></div>
                </button>
            </div>
        </div>
        {% endfor %}
    </main>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
